<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE VOID HAS YOU</title>
    <style>
        /* Body */
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #111;
            font-family: 'Courier New', monospace;
            color: #ff1a1a;
            text-align: center;
            cursor: url('https://i.imgur.com/jtXj8l4.png'), auto;
        }

        /* Glitch Effect */
        @keyframes glitch {
            0% {
                transform: skew(0.5deg);
                text-shadow: 2px 2px 2px #ff1a1a, -2px -2px 2px #ff1a1a, 2px 0 10px #ff1a1a;
            }
            10% {
                transform: skew(-1deg);
                text-shadow: 5px 5px 5px #ff1a1a, -5px -5px 5px #ff1a1a;
            }
            50% {
                transform: skew(3deg);
                text-shadow: 10px 10px 15px #ff1a1a, -10px -10px 20px #ff1a1a;
            }
            100% {
                transform: skew(0deg);
                text-shadow: none;
            }
        }

        /* Background Effects */
        @keyframes redWave {
            0% {background-color: #111;}
            50% {background-color: #ff1a1a;}
            100% {background-color: #111;}
        }

        /* Body Animation */
        body {
            animation: redWave 0.5s infinite alternate;
        }

        /* Insane Flickering Text */
        .insane-text {
            font-size: 5rem;
            color: white;
            animation: glitch 0.2s infinite;
            z-index: 100;
            padding: 20px;
            margin-top: 20%;
            position: relative;
        }

        /* Spinning Circle */
        @keyframes spinCircle {
            0% {transform: rotate(0deg) translateX(200px) rotate(0deg);}
            100% {transform: rotate(360deg) translateX(200px) rotate(-360deg);}
        }

        /* Random Shapes Moving */
        .shape {
            position: absolute;
            background-color: #ff0066;
            border-radius: 20%;
            opacity: 0.7;
            animation: moveRandomly 7s infinite linear;
        }

        @keyframes moveRandomly {
            0% {top: 10%; left: 10%;}
            25% {top: 30%; left: 80%;}
            50% {top: 50%; left: 60%;}
            75% {top: 70%; left: 30%;}
            100% {top: 90%; left: 50%;}
        }

        /* Image Distortion and Randomness */
        .random-image {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200px;
            height: 200px;
            object-fit: cover;
            animation: distortImage 1s infinite alternate;
        }

        @keyframes distortImage {
            0% {transform: rotate(0deg) scale(1);}
            25% {transform: rotate(90deg) scale(1.1);}
            50% {transform: rotate(180deg) scale(0.9);}
            75% {transform: rotate(270deg) scale(1.1);}
            100% {transform: rotate(360deg) scale(1);}
        }

        /* Hyperlinks with Chaos */
        a {
            color: #ff1a1a;
            text-decoration: none;
            font-size: 2rem;
            position: relative;
            transition: all 0.2s;
        }

        a:hover {
            color: #ff6600;
            transform: scale(1.5) rotate(360deg);
            text-shadow: 0 0 20px #ff6600, 0 0 30px #ff6600, 0 0 40px #ff6600;
        }

        /* Sound Effects */
        .sound {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

    </style>
</head>
<body>
    <div class="insane-text">
        THE VOID HAS YOU. EMBRACE THE CHAOS.
    </div>

    <!-- Random Moving Shapes -->
    <div class="shape" style="width: 150px; height: 150px;"></div>
    <div class="shape" style="width: 100px; height: 100px;"></div>

    <!-- Random Image with Glitch -->
    <img src="https://via.placeholder.com/200" class="random-image" style="animation-duration: 1.5s;" />

    <!-- Random Sound Effects -->
    <div class="sound" id="sound"></div>

    <script>
        // Trigger sound effects loop
        var audio = new Audio('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3');
        audio.loop = true;
        audio.volume = 0.5;
        audio.play();

        // Random glitch-triggered pop-up
        setInterval(function() {
            if (Math.random() > 0.9) {
                let popup = document.createElement('div');
                popup.style.position = 'absolute';
                popup.style.top = `${Math.random() * 100}%`;
                popup.style.left = `${Math.random() * 100}%`;
                popup.style.color = '#ff1a1a';
                popup.style.fontSize = '2rem';
                popup.style.fontFamily = 'Courier New';
                popup.innerText = 'ERROR: SYSTEM INTEGRITY COMPROMISED!';
                document.body.appendChild(popup);
                setTimeout(() => popup.remove(), 1000);
            }
        }, 3000);

        // Hover and click chaos
        document.body.addEventListener('mousemove', () => {
            let circle = document.createElement('div');
            circle.style.position = 'absolute';
            circle.style.top = `${Math.random() * 100}%`;
            circle.style.left = `${Math.random() * 100}%`;
            circle.style.width = '50px';
            circle.style.height = '50px';
            circle.style.borderRadius = '50%';
            circle.style.backgroundColor = '#ff1a1a';
            circle.style.animation = 'spinCircle 3s linear infinite';
            document.body.appendChild(circle);
            setTimeout(() => circle.remove(), 2000);
        });

        // Glitch effect on random clicks
        document.body.addEventListener('click', function() {
            let glitchEffect = document.createElement('div');
            glitchEffect.style.position = 'absolute';
            glitchEffect.style.top = `${Math.random() * 100}%`;
            glitchEffect.style.left = `${Math.random() * 100}%`;
            glitchEffect.style.color = '#ff1a1a';
            glitchEffect.style.fontSize = '3rem';
            glitchEffect.style.fontFamily = 'Courier New';
            glitchEffect.innerText = 'GLITCHING... SYSTEM FAILURE!';
            document.body.appendChild(glitchEffect);
            setTimeout(() => glitchEffect.remove(), 1500);
        });
    </script>
</body>
</html>
